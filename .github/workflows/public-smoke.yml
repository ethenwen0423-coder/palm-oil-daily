name: Public site smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: public-site-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public pages and API status
        env:
          SITE_URL: https://palm.vinsontesla.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/healthz" > health.txt
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/api/status" > status.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/assistant" > assistant.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/ai-daredevil" > ai-daredevil.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/api/ai-daredevil" > ai-daredevil.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 20 "$SITE_URL/api/ai-daredevil/pure-ai" > pure-ai-fund.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$SITE_URL/assistant.html")" = "308"
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
            --max-time 20 "$SITE_URL/assistant.html")" = "$SITE_URL/assistant"

      - name: Validate dynamic datasets and assistant page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = {
              "/api/reports",
              "/api/oil-futures",
              "/api/exchange-futures",
              "/api/quant-model-signals",
              "/api/supply-demand",
              "/api/contracts/current",
              "/api/forecast/metrics/latest",
              "/api/assistant/brief",
              "/api/ai-daredevil",
              "/api/ai-daredevil/pure-ai",
          }
          status = json.loads(Path("status.json").read_text(encoding="utf-8"))
          datasets = status.get("datasets", {})
          missing_routes = sorted(required - set(datasets))
          unavailable = sorted(
              route
              for route in required
              if datasets.get(route, {}).get("state") in {"missing", "invalid"}
          )
          if missing_routes:
              raise SystemExit(f"status endpoint missing routes: {missing_routes}")
          if unavailable:
              raise SystemExit(f"public datasets unavailable: {unavailable}")

          assistant = Path("assistant.html").read_text(encoding="utf-8")
          for marker in ("24h 盯盘助手", "assets/market-assistant.js"):
              if marker not in assistant:
                  raise SystemExit(f"assistant page missing marker: {marker}")
          daredevil = Path("ai-daredevil.html").read_text(encoding="utf-8")
          fund = json.loads(Path("ai-daredevil.json").read_text(encoding="utf-8"))
          pure_ai = json.loads(Path("pure-ai-fund.json").read_text(encoding="utf-8"))
          for marker in ("AI敢死队", "布林带模型", "纯AI决策", "assets/ai-daredevil.js", "不构成投资建议"):
              if marker not in daredevil:
                  raise SystemExit(f"AI Daredevil page missing marker: {marker}")
          if fund.get("model", {}).get("version") != "palm-oil-v2-real-contract-indicators-carry5-main-contract":
              raise SystemExit("AI Daredevil model version mismatch")
          if pure_ai.get("model", {}).get("version") != "pure-ai-multifactor-real-contract-v1":
              raise SystemExit("pure AI fund model version mismatch")
          if pure_ai.get("risk_policy", {}).get("target_drawdown") != 0.10:
              raise SystemExit("pure AI fund drawdown target mismatch")
          print(f"public smoke check passed: status={status.get('status')}, datasets={len(datasets)}")
          PY
